<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Track Ride — Vahan Mitra</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden}
        body{font-family:'Inter',sans-serif;display:flex;justify-content:center;background:#e8eceb}
        .phone-frame{width:100%;max-width:420px;height:100vh;position:relative;background:#f0f4f3;overflow:hidden;display:flex;flex-direction:column}
        .status-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;background:#1a5c54;color:white;font-size:12px;font-weight:500;z-index:10}
        .status-icons{display:flex;gap:5px;align-items:center}
        .status-icons i{font-size:11px}
        .header{display:flex;align-items:center;padding:12px 18px;background:#1a5c54;color:white;gap:12px;z-index:10}
        .header .back{font-size:20px;cursor:pointer}
        .header h1{font-family:'Poppins',sans-serif;font-size:17px;font-weight:600;flex:1}
        .header .share-btn{font-size:18px;cursor:pointer;padding:6px 10px;background:rgba(255,255,255,.15);border-radius:10px}

        /* Status Steps */
        .status-steps{background:white;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:2px;box-shadow:0 2px 10px rgba(0,0,0,.05);z-index:5}
        .step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
        .step-dot{width:14px;height:14px;border-radius:50%;background:#e0e0e0;position:relative;transition:all .5s}
        .step-dot.active{background:#1a5c54;box-shadow:0 0 0 4px rgba(26,92,84,.2)}
        .step-dot.done{background:#27ae60}
        .step-dot.done::after{content:'✓';position:absolute;top:-1px;left:2px;font-size:10px;color:white;font-weight:700}
        .step-line{height:3px;flex:1;background:#e0e0e0;border-radius:2px;min-width:10px}
        .step-line.done{background:#27ae60}
        .step-line.active{background:linear-gradient(90deg,#27ae60,#e0e0e0)}
        .step-label{font-size:8px;color:#999;text-align:center;white-space:nowrap;margin-top:2px}
        .step.active .step-label{color:#1a5c54;font-weight:600}
        .step.done .step-label{color:#27ae60}

        /* Map Area */
        .map-area{flex:1;position:relative;background:linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 30%,#a5d6a7 60%,#c8e6c9 100%);overflow:hidden}
        .map-roads{position:absolute;inset:0;opacity:.2}
        .map-roads svg{width:100%;height:100%}
        .map-pin-pickup{position:absolute;top:35%;left:30%;font-size:24px;animation:pinBounce 2s ease-in-out infinite;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
        .map-pin-drop{position:absolute;top:55%;right:25%;font-size:24px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
        @keyframes pinBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .animated-dot{position:absolute;width:16px;height:16px;border-radius:50%;background:#1a5c54;top:35%;left:30%;box-shadow:0 0 0 4px rgba(26,92,84,.3);animation:moveDot 4s ease-in-out infinite alternate}
        @keyframes moveDot{0%{top:35%;left:30%}50%{top:45%;left:50%}100%{top:55%;right:25%;left:65%}}
        .route-line-svg{position:absolute;inset:0}
        .route-line-svg svg{width:100%;height:100%}
        .eta-badge{position:absolute;top:15px;right:15px;background:white;padding:10px 16px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,.12);text-align:center}
        .eta-badge .eta-time{font-family:'Poppins',sans-serif;font-size:20px;font-weight:700;color:#1a5c54}
        .eta-badge .eta-label{font-size:11px;color:#999}
        .live-badge{position:absolute;top:15px;left:15px;background:#e74c3c;color:white;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px;animation:livePulse 2s ease-in-out infinite}
        .live-dot{width:6px;height:6px;border-radius:50%;background:white;animation:blink 1s ease-in-out infinite}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
        @keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.4)}50%{box-shadow:0 0 0 8px rgba(231,76,60,0)}}

        /* Driver Card */
        .driver-panel{background:white;border-radius:24px 24px 0 0;padding:20px;box-shadow:0 -6px 30px rgba(0,0,0,.1);z-index:10}
        .otp-share{background:linear-gradient(135deg,#f0f9f7,#e8f5e9);border-radius:14px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
        .otp-label{font-size:12px;color:#666}
        .otp-label strong{display:block;font-size:11px;color:#999;font-weight:500;margin-bottom:2px}
        .otp-code{font-family:'Poppins',sans-serif;font-size:28px;font-weight:800;color:#1a5c54;letter-spacing:6px}
        .arriving-text{text-align:center;font-size:14px;color:#1a5c54;font-weight:600;margin-bottom:12px}
        .arriving-text i{animation:carMove 2s ease-in-out infinite}
        @keyframes carMove{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

        .driver-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
        .d-avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#1a5c54,#2d8a7e);display:flex;align-items:center;justify-content:center;font-size:22px;color:white;flex-shrink:0}
        .d-info h3{font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:#333}
        .d-info .d-rating{font-size:12px;color:#d4a843}
        .d-info .d-vehicle{font-size:11px;color:#888;margin-top:1px}

        .action-row{display:flex;gap:8px;margin-bottom:12px}
        .act-btn{flex:1;padding:11px;border-radius:12px;border:1.5px solid #e0e0e0;background:white;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:500;transition:all .2s;color:#333}
        .act-btn:active{background:#f0f4f3;transform:scale(.97)}
        .act-btn i{color:#1a5c54}
        .act-btn.sos{background:#fef2f2;border-color:#fecaca;color:#e74c3c}
        .act-btn.sos i{color:#e74c3c}
        .act-btn.cancel{color:#e74c3c}
        .act-btn.cancel i{color:#e74c3c}

        .toast{position:fixed;top:30px;left:50%;transform:translateX(-50%) translateY(-100px);background:#1a5c54;color:white;padding:12px 24px;border-radius:12px;font-size:13px;font-weight:500;z-index:1000;transition:transform .4s ease;box-shadow:0 8px 25px rgba(0,0,0,.2)}
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="status-bar">
            <span>9:45</span>
            <div class="status-icons"><i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-three-quarters"></i></div>
        </div>
        <div class="header">
            <div class="back" onclick="window.location.href='home.html'"><i class="fas fa-arrow-left"></i></div>
            <h1>Live Tracking</h1>
            <div class="share-btn" onclick="showToast('Ride link copied! Share with family.')"><i class="fas fa-share-alt"></i></div>
        </div>

        <!-- Status Steps -->
        <div class="status-steps" id="statusSteps">
            <div class="step done"><div class="step-dot done"></div><div class="step-label">Booked</div></div>
            <div class="step-line done"></div>
            <div class="step done"><div class="step-dot done"></div><div class="step-label">Assigned</div></div>
            <div class="step-line active"></div>
            <div class="step active"><div class="step-dot active"></div><div class="step-label">On the way</div></div>
            <div class="step-line"></div>
            <div class="step"><div class="step-dot"></div><div class="step-label">Arrived</div></div>
            <div class="step-line"></div>
            <div class="step"><div class="step-dot"></div><div class="step-label">Started</div></div>
            <div class="step-line"></div>
            <div class="step"><div class="step-dot"></div><div class="step-label">Done</div></div>
        </div>

        <!-- Map Area -->
        <div class="map-area">
            <div class="map-roads">
                <svg viewBox="0 0 400 400">
                    <path d="M50,200 Q150,100 250,200 T400,180" stroke="#2d8a7e" stroke-width="3" fill="none" stroke-dasharray="10,5"/>
                    <path d="M0,300 Q200,150 400,250" stroke="#1a5c54" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
                    <path d="M100,50 Q200,300 350,100" stroke="#2d8a7e" stroke-width="1.5" fill="none" stroke-dasharray="4,4"/>
                    <circle cx="140" cy="170" r="30" fill="rgba(39,174,96,.1)" stroke="rgba(39,174,96,.2)" stroke-width="1"/>
                    <circle cx="300" cy="250" r="25" fill="rgba(231,76,60,.1)" stroke="rgba(231,76,60,.2)" stroke-width="1"/>
                </svg>
            </div>
            <div class="route-line-svg">
                <svg viewBox="0 0 400 400">
                    <path d="M120,160 C200,120 250,200 310,240" stroke="#1a5c54" stroke-width="3" fill="none" stroke-dasharray="8,4">
                        <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/>
                    </path>
                </svg>
            </div>
            <div class="map-pin-pickup" title="Pickup">🟢</div>
            <div class="map-pin-drop" title="Drop">🔴</div>
            <div class="animated-dot"></div>
            <div class="live-badge"><div class="live-dot"></div> LIVE</div>
            <div class="eta-badge">
                <div class="eta-time" id="etaTime">5</div>
                <div class="eta-label">mins away</div>
            </div>
        </div>

        <!-- Driver Panel -->
        <div class="driver-panel">
            <div class="arriving-text"><i class="fas fa-car-side"></i>&nbsp; Driver arriving in <strong id="etaText">5 mins</strong></div>

            <div class="otp-share">
                <div class="otp-label">
                    <strong>Share this OTP with driver</strong>
                    Ride verification code
                </div>
                <div class="otp-code">4829</div>
            </div>

            <div class="driver-row">
                <div class="d-avatar"><i class="fas fa-user"></i></div>
                <div class="d-info">
                    <h3>Rajesh Kumar</h3>
                    <div class="d-rating">⭐ 4.8 · 2,345 rides</div>
                    <div class="d-vehicle">OD 02 AB 1234 · White Swift Dzire</div>
                </div>
            </div>

            <div class="action-row">
                <button class="act-btn" onclick="showToast('📞 Calling Rajesh...')"><i class="fas fa-phone"></i> Call</button>
                <button class="act-btn" onclick="showToast('💬 Opening chat...')"><i class="fas fa-comment-dots"></i> Chat</button>
                <button class="act-btn" onclick="showToast('📤 Ride link copied!')"><i class="fas fa-share"></i> Share</button>
            </div>
            <div class="action-row">
                <button class="act-btn cancel" onclick="cancelRide()"><i class="fas fa-times-circle"></i> Cancel Ride</button>
                <button class="act-btn sos" onclick="triggerSOS()"><i class="fas fa-exclamation-triangle"></i> SOS Emergency</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(msg){
            var t=document.getElementById('toast');
            t.textContent=msg;
            t.style.transform='translateX(-50%) translateY(0)';
            setTimeout(function(){t.style.transform='translateX(-50%) translateY(-100px)'},2500)
        }

        function cancelRide(){
            if(confirm('Are you sure you want to cancel this ride? Cancellation charges may apply.')){
                showToast('❌ Ride cancelled');
                setTimeout(function(){window.location.href='home.html'},1500)
            }
        }

        function triggerSOS(){
            if(confirm('🚨 This will alert emergency contacts and local authorities. Continue?')){
                showToast('🚨 SOS Alert Sent! Help is on the way.');
                document.querySelector('.act-btn.sos').innerHTML='<i class="fas fa-check"></i> SOS Sent!';
                document.querySelector('.act-btn.sos').style.background='#dc2626';
                document.querySelector('.act-btn.sos').style.color='white';
            }
        }

        // Simulate ETA countdown
        var eta=5;
        setInterval(function(){
            if(eta>1){
                eta--;
                document.getElementById('etaTime').textContent=eta;
                document.getElementById('etaText').textContent=eta+' mins';
            } else {
                document.getElementById('etaTime').textContent='<1';
                document.getElementById('etaText').textContent='less than a minute';
                // Update status to Arrived
                var steps=document.querySelectorAll('.step');
                var lines=document.querySelectorAll('.step-line');
                steps[2].classList.remove('active');
                steps[2].classList.add('done');
                steps[2].querySelector('.step-dot').classList.remove('active');
                steps[2].querySelector('.step-dot').classList.add('done');
                lines[2].classList.add('done');
                steps[3].classList.add('active');
                steps[3].querySelector('.step-dot').classList.add('active');
                document.querySelector('.arriving-text').innerHTML='<i class="fas fa-check-circle" style="color:#27ae60"></i>&nbsp; Driver has <strong>arrived!</strong>';
            }
        },5000);
    </script>
</body>
</html>
