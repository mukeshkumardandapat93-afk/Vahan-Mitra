<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vahan Mitra — ଆପଣଙ୍କ ଭରସାର ସାଥୀ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a5c54;
        }
        .phone-frame {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 100vh;
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, #1a5c54 0%, #0d3d37 25%, #1a5c54 50%, #2d8a7e 75%, #1a5c54 100%);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Decorative elements */
        .deco-circle {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(212, 168, 67, 0.15);
        }
        .deco-circle.c1 { width: 300px; height: 300px; top: -80px; right: -80px; animation: pulse1 4s ease-in-out infinite; }
        .deco-circle.c2 { width: 250px; height: 250px; bottom: -60px; left: -60px; animation: pulse1 5s ease-in-out infinite 1s; }
        .deco-circle.c3 { width: 180px; height: 180px; top: 30%; left: -40px; border-color: rgba(255,255,255,0.08); animation: pulse1 6s ease-in-out infinite 0.5s; }
        .deco-circle.c4 { width: 120px; height: 120px; bottom: 25%; right: -30px; border-color: rgba(212,168,67,0.1); animation: pulse1 4.5s ease-in-out infinite 1.5s; }
        @keyframes pulse1 {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: rgba(212, 168, 67, 0.4);
            border-radius: 50%;
            animation: floatUp 6s ease-in-out infinite;
        }
        .particle:nth-child(5) { left: 10%; bottom: 0; animation-delay: 0s; animation-duration: 7s; }
        .particle:nth-child(6) { left: 25%; bottom: 0; animation-delay: 1s; width: 3px; height: 3px; }
        .particle:nth-child(7) { left: 50%; bottom: 0; animation-delay: 2s; animation-duration: 8s; }
        .particle:nth-child(8) { left: 70%; bottom: 0; animation-delay: 0.5s; width: 5px; height: 5px; }
        .particle:nth-child(9) { left: 85%; bottom: 0; animation-delay: 3s; animation-duration: 5s; }
        .particle:nth-child(10) { left: 40%; bottom: 0; animation-delay: 1.5s; width: 3px; height: 3px; }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }

        .splash-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .logo-container {
            width: 140px;
            height: 140px;
            border-radius: 35px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 3px rgba(212,168,67,0.3);
            animation: logoEntry 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.3);
            margin-bottom: 30px;
            background: white;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes logoEntry {
            0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
            60% { transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .app-name {
            font-family: 'Poppins', sans-serif;
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            animation: textFadeUp 0.8s ease forwards 0.5s;
            opacity: 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .tagline-odia {
            font-size: 16px;
            color: #d4a843;
            margin-top: 8px;
            font-weight: 500;
            animation: textFadeUp 0.8s ease forwards 0.8s;
            opacity: 0;
            letter-spacing: 0.5px;
        }
        .tagline-en {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-top: 6px;
            font-weight: 400;
            animation: textFadeUp 0.8s ease forwards 1s;
            opacity: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        @keyframes textFadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .divider-line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4a843, transparent);
            border-radius: 2px;
            margin: 20px 0;
            animation: textFadeUp 0.8s ease forwards 1.1s;
            opacity: 0;
        }

        .service-badges {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
            animation: textFadeUp 0.8s ease forwards 1.3s;
            opacity: 0;
        }
        .service-badge {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.85);
        }

        .btn-get-started {
            margin-top: 50px;
            padding: 16px 60px;
            background: linear-gradient(135deg, #d4a843, #c49535);
            color: #1a5c54;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            animation: btnEntry 0.8s ease forwards 1.5s;
            opacity: 0;
            box-shadow: 0 10px 30px rgba(212,168,67,0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-get-started:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(212,168,67,0.3);
        }
        @keyframes btnEntry {
            0% { opacity: 0; transform: translateY(30px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .skip-text {
            margin-top: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            animation: textFadeUp 0.8s ease forwards 1.8s;
            opacity: 0;
        }

        .bottom-wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            overflow: hidden;
        }
        .bottom-wave svg {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 80px;
            animation: waveMove 4s ease-in-out infinite;
        }
        @keyframes waveMove {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-25%); }
        }

        /* Loading dots */
        .loading-indicator {
            position: absolute;
            bottom: 100px;
            display: flex;
            gap: 6px;
            animation: textFadeUp 0.8s ease forwards 2s;
            opacity: 0;
        }
        .loading-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: rgba(212,168,67,0.6);
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .odisha-text {
            position: absolute;
            bottom: 30px;
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: textFadeUp 0.8s ease forwards 2s;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Decorative circles -->
        <div class="deco-circle c1"></div>
        <div class="deco-circle c2"></div>
        <div class="deco-circle c3"></div>
        <div class="deco-circle c4"></div>

        <!-- Floating particles -->
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

        <!-- Bottom wave -->
        <div class="bottom-wave">
            <svg viewBox="0 0 1440 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0,40 C360,80 720,0 1080,40 C1260,60 1440,30 1440,30 L1440,80 L0,80 Z" fill="rgba(212,168,67,0.08)"/>
            </svg>
        </div>

        <div class="splash-content">
            <div class="logo-container">
                <img src="WhatsApp Image 2026-10-05 at 8.09.28 PM.jpeg" alt="Vahan Mitra Logo">
            </div>

            <div class="app-name">Vahan Mitra</div>
            <div class="tagline-odia">ଆପଣଙ୍କ ଭରସାର ସାଥୀ</div>
            <div class="divider-line"></div>
            <div class="tagline-en">Your Ride, Your Way</div>

            <div class="service-badges">
                <span class="service-badge">🏍️ Bike</span>
                <span class="service-badge">🛺 Auto</span>
                <span class="service-badge">🚗 Cab</span>
                <span class="service-badge">📦 Parcel</span>
            </div>

            <button class="btn-get-started" onclick="goToLogin()">Get Started</button>
            <div class="skip-text">Auto-redirecting...</div>

            <div class="loading-indicator">
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            </div>
            <div class="odisha-text">Proudly serving Odisha</div>
        </div>
    </div>

    <script>
        function goToLogin() {
            document.querySelector('.splash-content').style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            document.querySelector('.splash-content').style.opacity = '0';
            document.querySelector('.splash-content').style.transform = 'scale(0.95)';
            setTimeout(function() {
                window.location.href = 'login.html';
            }, 500);
        }

        // Auto-redirect after 3 seconds
        setTimeout(function() {
            goToLogin();
        }, 3000);
    </script>
</body>
</html>
