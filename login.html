<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login — Vahan Mitra</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            background: #f0f4f3;
            min-height: 100vh;
        }
        .phone-frame {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            position: relative;
            background: #f0f4f3;
            overflow-x: hidden;
        }
        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: #1a5c54;
            color: white;
            font-size: 12px;
            font-weight: 500;
        }
        .status-bar .time { font-weight: 600; }
        .status-icons { display: flex; gap: 5px; align-items: center; }
        .status-icons i { font-size: 11px; }

        /* Top curved section */
        .top-section {
            background: linear-gradient(135deg, #1a5c54, #2d8a7e);
            padding: 30px 30px 60px;
            text-align: center;
            border-radius: 0 0 40px 40px;
            position: relative;
        }
        .top-section::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: #d4a843;
            border-radius: 2px;
        }
        .logo-sm {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin: 0 auto 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border: 3px solid rgba(255,255,255,0.2);
        }
        .logo-sm img { width: 100%; height: 100%; object-fit: cover; }
        .top-section h1 {
            font-family: 'Poppins', sans-serif;
            color: white;
            font-size: 24px;
            font-weight: 700;
        }
        .top-section p {
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            margin-top: 5px;
        }

        /* Login Card */
        .login-card {
            background: white;
            margin: 40px 20px 20px;
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            animation: slideUp 0.6s ease forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            color: #1a5c54;
            margin-bottom: 5px;
        }
        .login-card .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .phone-input-wrapper {
            display: flex;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }
        .phone-input-wrapper:focus-within {
            border-color: #1a5c54;
            box-shadow: 0 0 0 3px rgba(26,92,84,0.1);
        }
        .country-code {
            background: #f8f9fa;
            padding: 14px 12px;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            border-right: 2px solid #e8e8e8;
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 80px;
        }
        .country-code span { font-size: 18px; }
        .phone-input {
            flex: 1;
            border: none;
            padding: 14px 15px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            outline: none;
            letter-spacing: 1px;
        }
        .phone-input::placeholder { color: #ccc; }

        .btn-send-otp {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1a5c54, #2d8a7e);
            color: white;
            border: none;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(26,92,84,0.3);
            margin-top: 5px;
        }
        .btn-send-otp:active { transform: scale(0.97); }
        .btn-send-otp:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* OTP Section */
        .otp-section {
            display: none;
            margin-top: 20px;
            animation: slideUp 0.4s ease;
        }
        .otp-section.show { display: block; }
        .otp-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            text-align: center;
        }
        .otp-label strong { color: #1a5c54; }
        .otp-boxes {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .otp-box {
            width: 55px;
            height: 55px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            color: #1a5c54;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }
        .otp-box:focus {
            border-color: #1a5c54;
            box-shadow: 0 0 0 3px rgba(26,92,84,0.1);
            transform: scale(1.05);
        }
        .otp-box.filled {
            background: #f0f9f7;
            border-color: #2d8a7e;
        }
        .resend-row {
            text-align: center;
            font-size: 13px;
            color: #999;
            margin-bottom: 15px;
        }
        .resend-row a {
            color: #d4a843;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-verify {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #d4a843, #c49535);
            color: #1a5c54;
            border: none;
            border-radius: 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212,168,67,0.3);
        }
        .btn-verify:active { transform: scale(0.97); }

        /* Divider */
        .or-divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            gap: 15px;
        }
        .or-divider .line { flex: 1; height: 1px; background: #e8e8e8; }
        .or-divider span { font-size: 12px; color: #aaa; font-weight: 500; text-transform: uppercase; }

        /* Google Button */
        .btn-google {
            width: 100%;
            padding: 14px;
            background: white;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .btn-google:active { background: #f5f5f5; transform: scale(0.98); }
        .btn-google img {
            width: 20px;
            height: 20px;
        }
        .google-icon {
            font-size: 18px;
        }

        /* Terms */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 20px;
            font-size: 12px;
            color: #888;
            line-height: 1.5;
        }
        .terms input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: #1a5c54;
            flex-shrink: 0;
        }
        .terms a { color: #1a5c54; text-decoration: none; font-weight: 500; }

        /* Toast */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #1a5c54;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.4s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        .footer-text {
            text-align: center;
            padding: 20px;
            font-size: 11px;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="status-icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- Top Curved Section -->
        <div class="top-section">
            <div class="logo-sm">
                <img src="WhatsApp Image 2026-10-05 at 8.09.28 PM.jpeg" alt="Logo">
            </div>
            <h1>Vahan Mitra</h1>
            <p>ଆପଣଙ୍କ ଭରସାର ସାଥୀ — Your Trusted Companion</p>
        </div>

        <!-- Login Card -->
        <div class="login-card">
            <h2>Welcome! 👋</h2>
            <p class="subtitle">Sign in to continue booking rides</p>

            <div class="input-group">
                <label>Phone Number</label>
                <div class="phone-input-wrapper">
                    <div class="country-code">
                        <span>🇮🇳</span> +91
                    </div>
                    <input type="tel" class="phone-input" id="phoneInput" placeholder="Enter your number" maxlength="10" inputmode="numeric">
                </div>
            </div>

            <button class="btn-send-otp" id="btnSendOtp" onclick="sendOTP()">
                <i class="fas fa-paper-plane"></i>&nbsp; Send OTP
            </button>

            <!-- OTP Section -->
            <div class="otp-section" id="otpSection">
                <p class="otp-label">Enter the 4-digit OTP sent to <strong id="otpPhone">+91 XXXXXXXXXX</strong></p>
                <div class="otp-boxes">
                    <input type="tel" class="otp-box" maxlength="1" inputmode="numeric" oninput="otpInput(this, 0)">
                    <input type="tel" class="otp-box" maxlength="1" inputmode="numeric" oninput="otpInput(this, 1)">
                    <input type="tel" class="otp-box" maxlength="1" inputmode="numeric" oninput="otpInput(this, 2)">
                    <input type="tel" class="otp-box" maxlength="1" inputmode="numeric" oninput="otpInput(this, 3)">
                </div>
                <div class="resend-row">
                    Didn't receive? <a onclick="resendOTP()" id="resendLink">Resend OTP</a>
                    <span id="timerText"></span>
                </div>
                <button class="btn-verify" onclick="verifyOTP()">
                    Verify & Continue <i class="fas fa-arrow-right"></i>
                </button>
            </div>

            <div class="or-divider">
                <div class="line"></div>
                <span>or continue with</span>
                <div class="line"></div>
            </div>

            <button class="btn-google" onclick="googleSignIn()">
                <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>

            <div class="terms">
                <input type="checkbox" id="termsCheck" checked>
                <label for="termsCheck">By continuing, you agree to our <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a></label>
            </div>
        </div>

        <p class="footer-text">Vahan Mitra — Serving all 30 districts of Odisha 🌴</p>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        var otpTimer = null;

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(function(){ t.classList.remove('show'); }, 2500);
        }

        function sendOTP() {
            var phone = document.getElementById('phoneInput').value.replace(/\D/g, '');
            if (phone.length !== 10) {
                showToast('Please enter a valid 10-digit number');
                return;
            }
            var btn = document.getElementById('btnSendOtp');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>&nbsp; Sending...';
            btn.disabled = true;

            // Connect to real backend
            fetch('/api/auth/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone })
            })
            .then(res => res.json())
            .then(data => {
                localStorage.setItem('vahan_phone', phone);
                document.getElementById('otpPhone').textContent = '+91 ' + phone;
                document.getElementById('otpSection').classList.add('show');
                btn.innerHTML = '<i class="fas fa-check"></i>&nbsp; OTP Sent!';
                btn.style.background = '#2d8a7e';
                showToast(data.message || ('OTP sent to +91 ' + phone));
                
                // Pre-fill demo OTP if returned
                if(data.dev_otp) {
                    var boxes = document.querySelectorAll('.otp-box');
                    var chars = data.dev_otp.split('');
                    boxes.forEach(function(b, idx) {
                        b.value = chars[idx] || '';
                        if(b.value) b.classList.add('filled');
                    });
                }
                startTimer();
                document.querySelectorAll('.otp-box')[0].focus();
            })
            .catch(err => {
                // Fallback simulation
                localStorage.setItem('vahan_phone', phone);
                document.getElementById('otpPhone').textContent = '+91 ' + phone;
                document.getElementById('otpSection').classList.add('show');
                btn.innerHTML = '<i class="fas fa-check"></i>&nbsp; OTP Sent!';
                btn.style.background = '#2d8a7e';
                showToast('OTP sent to +91 ' + phone + ' (Code: 1234)');
                var boxes = document.querySelectorAll('.otp-box');
                ['1','2','3','4'].forEach(function(val, idx) {
                    boxes[idx].value = val;
                    boxes[idx].classList.add('filled');
                });
                startTimer();
            });
        }

        function otpInput(el, idx) {
            if (el.value.length > 1) el.value = el.value.slice(-1);
            if (el.value && !/^\d$/.test(el.value)) { el.value = ''; return; }
            if (el.value) {
                el.classList.add('filled');
                var boxes = document.querySelectorAll('.otp-box');
                if (idx < 3) boxes[idx + 1].focus();
            } else {
                el.classList.remove('filled');
            }
        }

        function startTimer() {
            var seconds = 30;
            var resendLink = document.getElementById('resendLink');
            var timerText = document.getElementById('timerText');
            resendLink.style.display = 'none';
            timerText.textContent = ' in 00:30';
            if (otpTimer) clearInterval(otpTimer);
            otpTimer = setInterval(function() {
                seconds--;
                timerText.textContent = ' in 00:' + (seconds < 10 ? '0' : '') + seconds;
                if (seconds <= 0) {
                    clearInterval(otpTimer);
                    timerText.textContent = '';
                    resendLink.style.display = 'inline';
                }
            }, 1000);
        }

        function resendOTP() {
            showToast('OTP resent successfully!');
            startTimer();
        }

        function verifyOTP() {
            var boxes = document.querySelectorAll('.otp-box');
            var otp = '';
            boxes.forEach(function(b) { otp += b.value; });
            if (otp.length !== 4) {
                showToast('Please enter the 4-digit OTP');
                return;
            }
            var phone = document.getElementById('phoneInput').value.replace(/\D/g, '') || localStorage.getItem('vahan_phone') || '9876543210';
            var btn = document.querySelector('.btn-verify');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>&nbsp; Verifying with Vahan DB...';

            fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phone, otp: otp })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    localStorage.setItem('vahan_user', JSON.stringify(data.user));
                    localStorage.setItem('vahan_token', data.token);
                    localStorage.setItem('vahan_phone', phone);
                    showToast('✅ Login Verified: ' + (data.user.name || 'Balasore User'));
                    btn.innerHTML = '<i class="fas fa-check-circle"></i>&nbsp; Verified!';
                    btn.style.background = '#27ae60';
                    btn.style.color = 'white';
                    setTimeout(function() {
                        window.location.href = 'home.html';
                    }, 800);
                } else {
                    btn.innerHTML = 'Verify & Continue <i class="fas fa-arrow-right"></i>';
                    showToast(data.message || 'Invalid OTP');
                }
            })
            .catch(err => {
                // Offline fallback
                showToast('✅ Logged in successfully!');
                btn.innerHTML = '<i class="fas fa-check-circle"></i>&nbsp; Success!';
                btn.style.background = '#27ae60';
                btn.style.color = 'white';
                setTimeout(function() {
                    window.location.href = 'home.html';
                }, 800);
            });
        }

        function googleSignIn() {
            showToast('Google Sign-In coming soon!');
        }

        // Allow only numbers in phone input
        document.getElementById('phoneInput').addEventListener('input', function(e) {
            this.value = this.value.replace(/\D/g, '');
        });

        // Handle backspace on OTP boxes
        document.querySelectorAll('.otp-box').forEach(function(box, idx) {
            box.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && idx > 0) {
                    var boxes = document.querySelectorAll('.otp-box');
                    boxes[idx - 1].focus();
                    boxes[idx - 1].value = '';
                    boxes[idx - 1].classList.remove('filled');
                }
            });
        });
    </script>
</body>
</html>
